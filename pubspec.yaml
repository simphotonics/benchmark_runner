name: benchmark_runner

description: A library for writing inline micro-benchmarks, running sync/async
  benchmarks, reporting and exporting score statistics.

version: 2.3.0

homepage: https://github.com/simphotonics/benchmark_runner

executables:
  # <command-name>:<script-name>
  benchmark_runner: benchmark_runner

topics:
  - benchmark
  - async
  - inline
  - histogram
  - statistics

environment:
  sdk: '^3.13.0'

dependencies:
  ansi_modifier: ^1.1.1
  args: ^2.7.0
  exception_templates: ^1.1.0
  glob: ^2.2.0
  lazy_memo: ^2.0.0
  path: ^1.9.1
  sample_statistics: ^1.3.0
    # git:
    #   url: git@github.com:simphotonics/sample_statistics.git
    #   ref: main
    # path: ../sample_statistics

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
  test_process: ^2.1.1
